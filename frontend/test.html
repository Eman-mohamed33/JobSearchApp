<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>Chat Test</title>
    <script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
    <style>
        body { font-family: sans-serif; display: flex; flex-direction: column; align-items: center; background: #f4f4f9; }
        #chat-container { width: 400px; height: 500px; background: white; border: 1px solid #ddd; margin-top: 20px; display: flex; flex-direction: column; }
        #messages { flex: 1; overflow-y: auto; padding: 10px; border-bottom: 1px solid #ddd; }
        .message { margin-bottom: 8px; padding: 5px 10px; border-radius: 5px; background: #e1f5fe; }
        .input-area { padding: 10px; display: flex; gap: 5px; }
        input { flex: 1; padding: 8px; }
        button { padding: 8px 15px; cursor: pointer; background: #007bff; color: white; border: none; }
    </style>
</head>
<body>

    <h2>تجربة الشات (Socket.io)</h2>
    
    <div id="chat-container">
        <div id="messages"></div>
        <div class="input-area">
            <input type="text" id="messageInput" placeholder="اكتب رسالة...">
            <button onclick="sendMessage()">إرسال</button>
        </div>
    </div>

    <script>

const baseURL = 'http://localhost:3000'
const token = `${localStorage.getItem("token")}`;
let globalProfile = {};
const headers = {
    'Content-Type': 'application/json; charset=UTF-8',
    'authorization': token
};
const socket = io(baseURL, {
    auth: { authorization: token }
})
        // 1. استخراج التوكن من الـ LocalStorage أو مكان حفظه

socket.on('connect', () => {
    console.log('Connected with ID:', socket.id);
});

// التعامل مع أخطاء الـ Authentication
socket.on('connect_error', (err) => {
    console.error('Connection Error:', err.message); 
    // لو التوكن غلط أو منتهي، الـ NestJS هيرجع خطأ هنا
    alert('Authentication Failed: ' + err.message);
});


        // 2. الاستماع للرسائل القادمة من السيرفر
        // استبدلي 'chat' باسم الـ MessageMapping اللي عاملاه في الـ Gateway
        socket.on('chat', (data) => {
            appendMessage(data);
        });

        function sendMessage() {
            const input = document.getElementById('messageInput');
            const message = input.value;
            
            if (message) {
                // 3. إرسال الرسالة للسيرفر
                // 'sendMessage' هو اسم الـ SubscribeMessage في الـ Gateway
                socket.emit('sendMessage', { message: message });
                input.value = '';
            }
        }

        function appendMessage(data) {
            const messagesDiv = document.getElementById('messages');
            const msgElement = document.createElement('div');
            msgElement.className = 'message';
            // عرض الرسالة (عدلي حسب الـ Object اللي بيرجع من الباك إيند)
            msgElement.textContent = typeof data === 'object' ? data.message : data;
            messagesDiv.appendChild(msgElement);
            messagesDiv.scrollTop = messagesDiv.scrollHeight;
        }
    </script>
</body>
</html>
